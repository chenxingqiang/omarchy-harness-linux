name: CI

on:
  push:
    branches: [quattro, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Headless test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out omarchy-pkgs for packaging coverage tests
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-pkgs
          path: omarchy-pkgs

      - name: Check out omarchy-iso for installer coverage tests
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-iso
          path: omarchy-iso

      - name: Restore packaged-like modes on the checkouts
        run: |
          # actions/checkout runs git inside the container under a permissive
          # umask, leaving group-writable bits on the tree (dirs 775, files
          # 664). The suites assert a packaged-like checkout -- root-owned with
          # no group-write bits, which the Plymouth trust chain requires, and
          # plain 0644 sources. Strip only the group/world write bits, so
          # git's executable bits stay intact.
          chmod -R g-w,o-w "$GITHUB_WORKSPACE"
          # The trust chain also walks every parent of the checkout, so the
          # runner's workspace directories must carry no group/world write
          # bits either.
          directory=$(dirname "$GITHUB_WORKSPACE")
          while [[ $directory != "/" ]]; do
            chmod g-w,o-w "$directory"
            directory=$(dirname "$directory")
          done

      - name: Install test dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git jq nodejs python ripgrep tmux curl imagemagick lua ffmpeg plocate libxkbcommon hyprland grim diffutils gum mise desktop-file-utils sudo openssh

      - name: Run the test suites
        run: |
          # The suites exercise the real non-privileged user path: the sudo
          # stubs they install on PATH must be reached, which root skips.
          # The checkout stays root-owned and world-readable (the default from
          # actions/checkout) rather than chowned to tester: omarchy-plymouth-set's
          # trust chain requires OMARCHY_PATH and every parent directory to be
          # root-owned, matching a real packaged install, and no test writes
          # into the checkout itself.
          useradd --create-home tester
          runuser -u tester -- git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u tester -- env \
            OMARCHY_PKGS_PATH="$GITHUB_WORKSPACE/omarchy-pkgs" \
            OMARCHY_ISO_PATH="$GITHUB_WORKSPACE/omarchy-iso" \
            ./test/all
